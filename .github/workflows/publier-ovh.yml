# Publie les pages légales sur https://timouni.com (hébergement OVH) à chaque mise à jour de main.
# Le mot de passe SFTP n'est jamais dans le dépôt : il est dans le secret GitHub OVH_FTP_PASSWORD.
name: Publier sur timouni.com
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency: publier-ovh
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier le secret
        env:
          MDP: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          if [ -z "$MDP" ]; then echo "::error::Secret OVH_FTP_PASSWORD absent : rien n'est publié."; exit 1; fi
      - name: Publier la présentation sans supprimer les autres fichiers
        if: startsWith(github.event.head_commit.message, 'Publier la presentation Timouni')
        env:
          MDP: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "timouns,$MDP" -e "set cmd:fail-exit yes; set sftp:auto-confirm yes; set net:max-retries 2; mkdir -p www/assets; mirror --reverse --verbose assets/ www/assets/; mput -O www/ decouverte.css decouverte.js defilement.css defilement.js vie-decouverte.css vie-decouverte.js; put -O www/ decouvrir.html; bye" sftp://ftp.cluster129.hosting.ovh.net
      - name: Envoyer les pages en SFTP vers www/
        if: ${{ !startsWith(github.event.head_commit.message, 'Publier la presentation Timouni') }}
        env:
          MDP: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "timouns,$MDP" -e "set sftp:auto-confirm yes; set net:max-retries 2; rm -r -f www/.git; rm -r -f www/.github; mirror --reverse --delete --verbose --exclude '^\.git' --exclude '^README' --exclude '^\.nojekyll' ./ www/; bye" sftp://ftp.cluster129.hosting.ovh.net
